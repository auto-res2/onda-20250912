[project]
name = "safe-haste"
version = "0.1.0"
description = "Refactored SAFE-HASTE research codebase"
readme = "README.md"
authors = [
  {name = "Researcher", email = "research@safehaste.ai"}
]
license = {text = "MIT"}

# Dependencies must be defined as an **array** under the [project] table
# (see PEP 621).  This fixes the static-analysis error about mapping usage.
dependencies = [
    "torch>=1.13.0",
    "torchvision>=0.14.0",
    "torchaudio>=0.13.0",
    "torchmetrics>=1.1.0",
    "diffusers>=0.20.0",
    "numpy>=1.21.0",
    "scipy>=1.8.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "ptflops>=0.7.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
